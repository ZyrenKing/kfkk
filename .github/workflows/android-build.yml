name: Builds

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLET_FORCE_YES: "true" # تعريف المتغير هنا يجعله متاحاً لكل الخطوات
      
    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: 🐦 إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.3' # نثبت الإصدار الذي يطلبه Flet بالضبط

      - name: 🐍 إعداد بايثون 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 تثبيت Flet
        run: pip install flet==0.80.0

      - name: 🏗️ بناء تطبيق الأندرويد
        # نستخدم --yes مع المتغير البيئي الذي عرفناه في الأعلى
        run: flet build apk --yes

      - name: 📤 حفظ ملف الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: my-flet-app-apk
          path: build/apk/**/*.apk
