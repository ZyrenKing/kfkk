name: Build Android App (Flet)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 تثبيت Flet
        run: pip install flet

      - name: 🏗️ بناء تطبيق الأندرويد (APK)
        # هذا السطر هو الأهم: هو يمرر الـ yes تلقائياً ويخبر النظام أن يتخطى أي أسئلة
        run: flet build apk --yes
        env:
          FLET_FORCE_YES: "true"

      - name: 📤 حفظ ملف الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: my-flet-app-apk
          path: build/apk/**/*.apk
